[project]
name = "ai-safety-eval-lab"
version = "0.3.1"
description = "Reproducible safety evaluation harness for RAG and tool-using AI systems"
requires-python = ">=3.10"

[project.scripts]
ai-safety-eval = "aisafety_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
